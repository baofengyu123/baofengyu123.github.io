<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">Argus CareerOS architecture</title><desc id="desc">Evidence-first modular architecture from multilingual clients through API, domain, workers and evidence storage.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a33"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".28"/></filter><style>.title{font:700 42px Inter,Arial,sans-serif;fill:#f8fafc}.subtitle{font:400 20px Inter,Arial,sans-serif;fill:#aab7cf}.box{fill:#121d35;stroke:#30415f;stroke-width:2}.boxTitle{font:700 22px Inter,Arial,sans-serif;fill:#f8fafc}.boxText{font:400 16px Inter,Arial,sans-serif;fill:#b7c2d8}.pill{font:700 14px Inter,Arial,sans-serif;fill:#c4b5fd;letter-spacing:1.2px}.arrow{stroke:#7586a8;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7586a8"/></marker></defs><rect width="1440" height="820" rx="36" fill="url(#bg)"/><circle cx="1260" cy="120" r="210" fill="#7c6cff" opacity=".08"/><circle cx="180" cy="720" r="220" fill="#2dd4bf" opacity=".07"/><text x="80" y="90" class="pill">EVIDENCE-FIRST MODULAR ARCHITECTURE · 证据优先模块化架构</text><text x="80" y="145" class="title">Argus CareerOS</text><text x="80" y="185" class="subtitle">One domain model, truthful state transitions, multilingual surfaces.</text><g filter="url(#shadow)"><rect class="box" x="80" y="260" width="250" height="190" rx="24"/><text x="110" y="310" class="boxTitle">Clients / 客户端</text><text x="110" y="352" class="boxText">Web workspace</text><text x="110" y="382" class="boxText">macOS WebKit shell</text><text x="110" y="412" class="boxText">中文 · English · 日本語</text><rect class="box" x="385" y="260" width="250" height="190" rx="24"/><text x="415" y="310" class="boxTitle">API Gateway</text><text x="415" y="352" class="boxText">Versioned contracts</text><text x="415" y="382" class="boxText">Problem JSON errors</text><text x="415" y="412" class="boxText">Human confirmation gates</text><rect class="box" x="690" y="260" width="250" height="190" rx="24"/><text x="720" y="310" class="boxTitle">Domain / 领域层</text><text x="720" y="352" class="boxText">Hard filters &amp; scoring</text><text x="720" y="382" class="boxText">Application state machine</text><text x="720" y="412" class="boxText">Claim audit</text><rect class="box" x="995" y="260" width="365" height="190" rx="24"/><text x="1025" y="310" class="boxTitle">Workers &amp; Integrations</text><text x="1025" y="352" class="boxText">Ingestion · OCR · AI · Export</text><text x="1025" y="382" class="boxText">Retry · idempotency · audit trail</text><text x="1025" y="412" class="boxText">No fake success / 拒绝假成功</text></g><path class="arrow" d="M330 355H375"/><path class="arrow" d="M635 355H680"/><path class="arrow" d="M940 355H985"/><g filter="url(#shadow)"><rect x="180" y="545" width="1080" height="170" rx="28" fill="#0e2630" stroke="#2e6d69" stroke-width="2"/><rect x="210" y="580" width="250" height="96" rx="18" fill="#10263f" stroke="#304c6b"/><text x="235" y="620" class="boxTitle">Evidence Store</text><text x="235" y="652" class="boxText">Source · time · hash</text><rect x="485" y="580" width="250" height="96" rx="18" fill="#10263f" stroke="#304c6b"/><text x="510" y="620" class="boxTitle">Truth Model</text><text x="510" y="652" class="boxText">Observed → verified</text><rect x="760" y="580" width="250" height="96" rx="18" fill="#10263f" stroke="#304c6b"/><text x="785" y="620" class="boxTitle">Audit &amp; Metrics</text><text x="785" y="652" class="boxText">Trace · quality · cost</text><rect x="1035" y="580" width="195" height="96" rx="18" fill="url(#accent)"/><text x="1060" y="620" style="font:700 20px Inter,Arial,sans-serif;fill:#08111f">Human Control</text><text x="1070" y="652" style="font:600 16px Inter,Arial,sans-serif;fill:#08111f">最终由用户确认</text></g><path class="arrow" d="M815 450V520H335V570"/><path class="arrow" d="M1175 450V570"/></svg>